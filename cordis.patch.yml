# 注册本 bundle 携带的技能到 DSH 技能系统。
# 重要：安装后本包位于 <profile>/node_modules/dsh-we-wallpaper-sync/，
# customSkillDirs 需指向该目录下的 skills/。因为该路径因安装布局而异，
# 静态补丁无法预知绝对路径——请按实际安装路径调整，或由维护者在评审时接线。
# 未生效时也可整体保留技能文件，由 DSH 的技能文件系统提供方通过
# DSH_BUNDLED_SKILL_DIR 或自定义根发现。
- insert:
    - id: dsh-we-wallpaper-sync-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-we-wallpaper-sync
        includeDefaultRoots: false
        customSkillDirs:
          - ./skills   # ← 请改成 <profile>/node_modules/dsh-we-wallpaper-sync/skills
